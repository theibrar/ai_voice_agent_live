<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="apex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3157D5" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D99025" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="32" height="32" rx="8" fill="#0F172A" />
  
  <!-- Outer subtle glowing border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" fill="none" stroke="url(#apex-grad)" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Apex Waveform Bars -->
  <rect x="7" y="13" width="2.5" height="6" rx="1.25" fill="#38BDF8" />
  <rect x="11.5" y="9" width="2.5" height="14" rx="1.25" fill="url(#apex-grad)" />
  <rect x="16" y="6" width="2.5" height="20" rx="1.25" fill="#FFFFFF" />
  <rect x="20.5" y="10" width="2.5" height="12" rx="1.25" fill="url(#accent-grad)" />
  <rect x="25" y="14" width="2.5" height="4" rx="1.25" fill="#D99025" />
</svg>
